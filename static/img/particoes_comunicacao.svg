<svg width="620" height="470" viewBox="0 0 620 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="d1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="470" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#333">As partições da flash e os dois microcontroladores</text>

  <!-- partições -->
  <text x="310" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#555">Flash do ESP32-S3 (16 MB) dividida em regiões</text>
  <rect x="90" y="62" width="440" height="26" rx="4" fill="#f2f2f1" stroke="#888" stroke-width="1"/>
  <text x="100" y="79" font-size="11" fill="#333">nvs · 0x9000 · configurações do sistema</text>
  <rect x="90" y="90" width="440" height="26" rx="4" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.2"/>
  <text x="100" y="107" font-size="11" fill="#333">factory · 0x10000 · o firmware (o código C) — 1 MB</text>
  <rect x="90" y="118" width="440" height="30" rx="4" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.6"/>
  <text x="100" y="137" font-size="11" font-weight="700" fill="#0F6E56">model · 0x110000 · os pesos (nano-grump.bin) — 14,9 MB</text>
  <rect x="90" y="150" width="440" height="24" rx="4" fill="#f2f2f1" stroke="#888" stroke-width="1"/>
  <text x="100" y="166" font-size="11" fill="#333">coredump · 0xFF0000 · log de falha</text>

  <!-- comunicação -->
  <text x="310" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#555">Os dois microcontroladores conversam</text>

  <rect x="40" y="230" width="230" height="150" rx="10" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.6"/>
  <text x="155" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#3B8BD4">ESP32-WROOM-32</text>
  <text x="155" y="272" text-anchor="middle" font-size="11" fill="#333">o CORPO</text>
  <text x="155" y="296" text-anchor="middle" font-size="11" fill="#333">sensores + navegação</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#333">detecta a situação</text>
  <text x="155" y="340" text-anchor="middle" font-size="11" fill="#555">"bati num obstáculo!"</text>

  <rect x="350" y="230" width="230" height="150" rx="10" fill="#fdeee0" stroke="#BA7517" stroke-width="1.6"/>
  <text x="465" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#BA7517">ESP32-S3</text>
  <text x="465" y="272" text-anchor="middle" font-size="11" fill="#333">o CÉREBRO</text>
  <text x="465" y="296" text-anchor="middle" font-size="11" fill="#333">roda a LLM</text>
  <text x="465" y="316" text-anchor="middle" font-size="11" fill="#333">gera a frase + display</text>
  <text x="465" y="340" text-anchor="middle" font-size="11" fill="#555">"A wall. Again. Wow."</text>

  <line x1="272" y1="300" x2="348" y2="300" stroke="#0F6E56" stroke-width="2" marker-end="url(#d1)"/>
  <text x="310" y="292" text-anchor="middle" font-size="10" fill="#0F6E56">marcador</text>
  <text x="310" y="315" text-anchor="middle" font-size="9" fill="#777">&lt;obstacle&gt;</text>

  <text x="310" y="410" text-anchor="middle" font-size="12" fill="#777">O corpo manda só a etiqueta da situação; o cérebro devolve a frase sarcástica.</text>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#777">Comunicação por Serial/UART entre os dois.</text>
</svg>
