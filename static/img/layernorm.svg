<svg width="620" height="250" viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="l1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="250" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#333">LayerNorm: reequilibra os números para uma escala padrão</text>

  <rect x="180" y="44" width="260" height="40" rx="9" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.4"/>
  <text x="310" y="69" text-anchor="middle" font-size="13" fill="#333">entrada:  [ 2 , 4 , 6 , 8 ]</text>
  <line x1="310" y1="84" x2="310" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#l1)"/>
  <text x="450" y="95" font-size="11" fill="#777">1. subtrai a média (5)</text>

  <rect x="180" y="100" width="260" height="40" rx="9" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="310" y="125" text-anchor="middle" font-size="13" fill="#333">[ -3 , -1 , 1 , 3 ]</text>
  <line x1="310" y1="140" x2="310" y2="154" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#l1)"/>
  <text x="450" y="151" font-size="11" fill="#777">2. divide pelo desvio (≈2,24)</text>

  <rect x="180" y="156" width="260" height="40" rx="9" fill="#eaf5e0" stroke="#639922" stroke-width="1.4"/>
  <text x="310" y="181" text-anchor="middle" font-size="12" fill="#333">[ -1,34 , -0,45 , 0,45 , 1,34 ]</text>

  <text x="310" y="225" text-anchor="middle" font-size="12" fill="#777">Se a entrada fosse [200,400,600,800], a saída seria a MESMA. Por isso estabiliza.</text>
</svg>
