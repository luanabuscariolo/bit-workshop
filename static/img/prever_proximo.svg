<svg width="620" height="280" viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="280" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#333">A única coisa que uma LLM faz: prever o próximo pedacinho</text>

  <rect x="60" y="90" width="300" height="60" rx="10" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.5"/>
  <text x="210" y="115" text-anchor="middle" font-size="13" fill="#333">"O gato subiu no..."</text>
  <text x="210" y="135" text-anchor="middle" font-size="11" fill="#777">o começo que você deu</text>

  <line x1="362" y1="120" x2="418" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#p1)"/>
  <text x="390" y="108" text-anchor="middle" font-size="10" fill="#777">prevê</text>

  <rect x="420" y="90" width="150" height="60" rx="10" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="495" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">"telhado"</text>
  <text x="495" y="135" text-anchor="middle" font-size="11" fill="#777">o que vem a seguir</text>

  <text x="310" y="200" text-anchor="middle" font-size="12" fill="#555">Repetindo essa previsão, um pedacinho por vez, ela escreve frases inteiras.</text>
  <text x="310" y="228" text-anchor="middle" font-size="12" fill="#777">É só isso. Todo o resto da tecnologia existe para fazer essa previsão bem feita.</text>
  <text x="310" y="256" text-anchor="middle" font-size="11" fill="#534AB7">No nosso robô, o "pedacinho" é um caractere (uma letra por vez).</text>
</svg>
