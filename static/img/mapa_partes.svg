<svg width="620" height="400" viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="400" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#333">O caminho do tutorial</text>

  <!-- Parte 0 -->
  <rect x="180" y="48" width="260" height="40" rx="9" fill="#f5f5f4" stroke="#888" stroke-width="1.4"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#555">Parte 0 — Boas-vindas (você está aqui)</text>
  <text x="310" y="81" text-anchor="middle" font-size="10" fill="#777">visão geral e como usar o material</text>
  <line x1="310" y1="88" x2="310" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="180" y="102" width="260" height="40" rx="9" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.4"/>
  <text x="310" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#3B8BD4">Parte 1 — O Robô (o corpo)</text>
  <text x="310" y="135" text-anchor="middle" font-size="10" fill="#777">montagem, simulação e código</text>
  <line x1="310" y1="142" x2="310" y2="154" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="180" y="156" width="260" height="40" rx="9" fill="#eaf5e0" stroke="#639922" stroke-width="1.4"/>
  <text x="310" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#639922">Parte 2 — O que é uma LLM</text>
  <text x="310" y="189" text-anchor="middle" font-size="10" fill="#777">a grande ideia, sem código</text>
  <line x1="310" y1="196" x2="310" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="180" y="210" width="260" height="40" rx="9" fill="#f4f2fc" stroke="#534AB7" stroke-width="1.4"/>
  <text x="310" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#534AB7">Parte 3 — A LLM do zero (o cérebro)</text>
  <text x="310" y="243" text-anchor="middle" font-size="10" fill="#777">construir e treinar o modelo</text>
  <line x1="310" y1="250" x2="310" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="180" y="264" width="260" height="40" rx="9" fill="#fdeee0" stroke="#BA7517" stroke-width="1.4"/>
  <text x="310" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#BA7517">Parte 4 — ESP32-S3 (a união)</text>
  <text x="310" y="297" text-anchor="middle" font-size="10" fill="#777">embarcar o cérebro no robô</text>
  <line x1="310" y1="304" x2="310" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="180" y="318" width="260" height="40" rx="9" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.4"/>
  <text x="310" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#B23A2E">Parte 5 — Apêndices</text>
  <text x="310" y="351" text-anchor="middle" font-size="10" fill="#777">glossário, problemas e próximos passos</text>

  <text x="310" y="384" text-anchor="middle" font-size="11" fill="#777">Você pode seguir em ordem ou pular direto para a parte que precisa.</text>
