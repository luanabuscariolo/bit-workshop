<svg width="620" height="340" viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="340" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#333">A FFN: expandir → cortar negativos → contrair</text>

  <rect x="200" y="44" width="220" height="44" rx="9" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.4"/>
  <text x="310" y="70" text-anchor="middle" font-size="13" fill="#333">entra (tam. 2):  [ 1 , -2 ]</text>
  <line x1="310" y1="88" x2="310" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#f1)"/>
  <text x="430" y="100" font-size="11" fill="#777">1. expandir (2 → 4)</text>

  <rect x="200" y="106" width="220" height="44" rx="9" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="310" y="132" text-anchor="middle" font-size="13" fill="#333">[ 1 , -2 , -1 , 3 ]</text>
  <line x1="310" y1="150" x2="310" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#f1)"/>
  <text x="430" y="162" font-size="11" fill="#777">2. ReLU (negativos → 0)</text>

  <rect x="200" y="168" width="220" height="44" rx="9" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.4"/>
  <text x="310" y="194" text-anchor="middle" font-size="13" fill="#333">[ 1 , 0 , 0 , 3 ]</text>
  <line x1="310" y1="212" x2="310" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#f1)"/>
  <text x="430" y="224" font-size="11" fill="#777">3. contrair (4 → 2)</text>

  <rect x="200" y="230" width="220" height="44" rx="9" fill="#eaf5e0" stroke="#639922" stroke-width="1.4"/>
  <text x="310" y="256" text-anchor="middle" font-size="13" fill="#333">sai (tam. 2):  [ 4 , 0 ]</text>

  <text x="310" y="305" text-anchor="middle" font-size="12" fill="#777">Roda para cada token separadamente. A atenção mistura entre tokens; a FFN processa dentro de cada um.</text>
</svg>
