<svg width="620" height="340" viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="340" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Mapa de pinos definitivo — ESP32 → componentes</text>

  <!-- cabeçalho -->
  <rect x="30" y="44" width="560" height="32" rx="6" fill="#534AB7"/>
  <text x="190" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Componente / função</text>
  <text x="430" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Pino ESP32</text>
  <line x1="310" y1="44" x2="310" y2="330" stroke="#ddd" stroke-width="1"/>

  <!-- linhas -->
  <rect x="30" y="76" width="560" height="30" rx="0" fill="#e8f4f0"/>
  <text x="190" y="96" text-anchor="middle" font-size="12" fill="#333">HC-SR04 · TRIG (dispara o som)</text>
  <text x="430" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#0F6E56">GPIO 32</text>

  <rect x="30" y="106" width="560" height="30" rx="0" fill="#fff"/>
  <text x="190" y="126" text-anchor="middle" font-size="12" fill="#333">HC-SR04 · ECHO (recebe o eco)</text>
  <text x="430" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#0F6E56">GPIO 33</text>

  <rect x="30" y="136" width="560" height="30" rx="0" fill="#f4f2fc"/>
  <text x="190" y="156" text-anchor="middle" font-size="12" fill="#333">Servo SG90 · PWM (sinal de ângulo)</text>
  <text x="430" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#534AB7">GPIO 13</text>

  <rect x="30" y="166" width="560" height="30" rx="0" fill="#fdeee0"/>
  <text x="190" y="186" text-anchor="middle" font-size="12" fill="#333">L298N · IN1 (motor esq. sentido A)</text>
  <text x="430" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#BA7517">GPIO 22</text>

  <rect x="30" y="196" width="560" height="30" rx="0" fill="#fff"/>
  <text x="190" y="216" text-anchor="middle" font-size="12" fill="#333">L298N · IN2 (motor esq. sentido B)</text>
  <text x="430" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#BA7517">GPIO 21</text>

  <rect x="30" y="226" width="560" height="30" rx="0" fill="#fdeee0"/>
  <text x="190" y="246" text-anchor="middle" font-size="12" fill="#333">L298N · ENA (velocidade motor esq.)</text>
  <text x="430" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#BA7517">GPIO 23</text>

  <rect x="30" y="256" width="560" height="30" rx="0" fill="#fff"/>
  <text x="190" y="276" text-anchor="middle" font-size="12" fill="#333">L298N · IN3/IN4 (motor dir. A/B)</text>
  <text x="430" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#BA7517">GPIO 19 / 18</text>

  <rect x="30" y="286" width="560" height="30" rx="0" fill="#fdeee0"/>
  <text x="190" y="306" text-anchor="middle" font-size="12" fill="#333">L298N · ENB (velocidade motor dir.)</text>
  <text x="430" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#BA7517">GPIO 5</text>

  <line x1="30" y1="76" x2="590" y2="76" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="106" x2="590" y2="106" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="136" x2="590" y2="136" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="166" x2="590" y2="166" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="196" x2="590" y2="196" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="226" x2="590" y2="226" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="256" x2="590" y2="256" stroke="#ddd" stroke-width="0.8"/>
  <line x1="30" y1="286" x2="590" y2="286" stroke="#ddd" stroke-width="0.8"/>
  <rect x="30" y="44" width="560" height="272" rx="6" fill="none" stroke="#ccc" stroke-width="1"/>
</svg>
