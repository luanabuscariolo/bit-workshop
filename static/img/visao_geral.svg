<svg width="620" height="330" viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="v1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="330" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#333">O projeto: um robô com corpo e cérebro</text>

  <!-- corpo -->
  <rect x="40" y="70" width="240" height="180" rx="12" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.8"/>
  <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#3B8BD4">O CORPO</text>
  <text x="160" y="120" text-anchor="middle" font-size="11" fill="#555">ESP32-WROOM-32</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#333">• anda com 2 motores</text>
  <text x="160" y="168" text-anchor="middle" font-size="12" fill="#333">• sensor de distância</text>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#333">• desvia de obstáculos</text>
  <text x="160" y="212" text-anchor="middle" font-size="12" fill="#333">• detecta a situação</text>
  <text x="160" y="236" text-anchor="middle" font-size="11" fill="#777">(Parte 1)</text>

  <!-- cérebro -->
  <rect x="340" y="70" width="240" height="180" rx="12" fill="#fdeee0" stroke="#BA7517" stroke-width="1.8"/>
  <text x="460" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#BA7517">O CÉREBRO</text>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="#555">ESP32-S3 + LLM própria</text>
  <text x="460" y="146" text-anchor="middle" font-size="12" fill="#333">• recebe a situação</text>
  <text x="460" y="168" text-anchor="middle" font-size="12" fill="#333">• gera frase sarcástica</text>
  <text x="460" y="190" text-anchor="middle" font-size="12" fill="#333">• mostra no display</text>
  <text x="460" y="212" text-anchor="middle" font-size="12" fill="#333">• tem personalidade</text>
  <text x="460" y="236" text-anchor="middle" font-size="11" fill="#777">(Partes 3 e 4)</text>

  <line x1="282" y1="150" x2="338" y2="150" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#v1)"/>
  <text x="310" y="140" text-anchor="middle" font-size="10" fill="#0F6E56">situação</text>

  <text x="310" y="290" text-anchor="middle" font-size="13" fill="#333">"Bati num obstáculo" → "Oh look, a wall. Groundbreaking. Turning."</text>
  <text x="310" y="314" text-anchor="middle" font-size="12" fill="#777">Dois microcontroladores conversando: um sente o mundo, o outro comenta com deboche.</text>
</svg>
