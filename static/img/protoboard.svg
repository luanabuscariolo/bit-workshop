<svg width="620" height="320" viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="320" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Como a protoboard conecta as coisas por dentro</text>

  <!-- trilho + -->
  <rect x="60" y="50" width="500" height="30" rx="6" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.5"/>
  <text x="570" y="70" text-anchor="end" font-size="12" fill="#B23A2E">+ (positivo) — ligado na HORIZONTAL</text>

  <!-- trilho - -->
  <rect x="60" y="88" width="500" height="30" rx="6" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.5"/>
  <text x="570" y="108" text-anchor="end" font-size="12" fill="#3B8BD4">− (negativo) — ligado na HORIZONTAL</text>

  <!-- área central -->
  <rect x="60" y="135" width="500" height="120" rx="6" fill="#f9f9f8" stroke="#ccc" stroke-width="1"/>
  <text x="310" y="158" text-anchor="middle" font-size="12" fill="#888">área de componentes</text>

  <!-- colunas verticais destacadas -->
  <rect x="90" y="148" width="22" height="94" rx="4" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="101" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">col A</text>
  <rect x="130" y="148" width="22" height="94" rx="4" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="141" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">col B</text>

  <!-- sulco -->
  <line x1="60" y1="196" x2="560" y2="196" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="570" y="200" text-anchor="end" font-size="11" fill="#888">sulco central</text>

  <rect x="90" y="203" width="22" height="40" rx="4" fill="#f4f2fc" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="130" y="203" width="22" height="40" rx="4" fill="#f4f2fc" stroke="#534AB7" stroke-width="1.3"/>

  <!-- legenda -->
  <rect x="60" y="278" width="18" height="18" rx="3" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.2"/>
  <text x="84" y="291" font-size="12" fill="#333">Trilho + e −: cada linha inteira é um ponto elétrico só</text>

  <rect x="60" y="300" width="18" height="12" rx="3" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="84" y="310" font-size="12" fill="#333">Colunas: ligadas na vertical (grupos de 5); o sulco separa cima e baixo</text>
</svg>
